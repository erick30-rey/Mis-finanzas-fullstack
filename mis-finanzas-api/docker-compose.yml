version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: mis-finanzas-db
    restart: always

    environment:
      POSTGRES_DB: mis_finanzas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 100068

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mis_finanzas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mis-finanzas-api

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mis_finanzas_db
      DB_USERNAME: postgres
      DB_PASSWORD: 100068

    restart: unless-stopped

volumes:
  postgres_data: